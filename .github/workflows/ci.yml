name: CI

# Mirrors the local four-gate pipeline (`npm run pipeline`):
#   build job   → gate 1 (code) + gate 4 (package verification)
#   e2e job     → gate 2 (headless e2e)
#   catalog job → gate 3 (live Retail Prices catalog contract)
# Marketplace publishing is deliberately not automated — it stays a human
# step; the tag release below only attaches the VSIX to a GitHub release.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Gate 1 + 4 — code, package, verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck, lint, unit tests
        run: npm run gate:code
      - name: Package + verify VSIX
        run: npm run gate:package
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: '*.vsix'
          if-no-files-found: error

  e2e:
    name: Gate 2 — headless e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install xvfb (virtual display for the test host)
        run: sudo apt-get update && sudo apt-get install -y xvfb
      # scripts/run-e2e.js wraps the test host in xvfb-run when headless.
      - run: npm run gate:e2e

  catalog:
    name: Gate 3 — live catalog contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Probes the live Retail Prices API through the built CLI. A red job
      # means catalog drift (a fixture SKU stopped resolving) or the API
      # is unreachable — the gate output says which, never a silent pass.
      - run: npm run gate:catalog

  release:
    name: Release on tag
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx vsce package --no-yarn
      - name: Attach vsix to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: '*.vsix'
          generate_release_notes: true
